name: dispatch-build-bottle

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Comma-separated Homebrew runner names.
        required: true
      formula:
        description: Formula to bottle.
        required: true
      timeout:
        description: Build timeout in minutes.
        required: false
        default: "60"
      issue:
        description: Issue number for failure reporting.
        required: false
      upload:
        description: Upload bottles and push the bottle commit.
        required: false
        default: false
        type: boolean

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build runner matrix
        id: matrix
        env:
          RUNNERS: ${{ inputs.runner }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          include = []
          for raw in os.environ["RUNNERS"].split(","):
            runner = raw.strip()
            if not runner:
              continue

            label = runner
            if re.fullmatch(r"\d+(?:\.\d+)?", runner):
              label = f"macos-{runner}-intel"
            elif match := re.fullmatch(r"(\d+(?:\.\d+)?)-arm64", runner):
              label = f"macos-{match.group(1)}"

            include.append({"artifact": runner.replace("/", "-"), "label": label})

          print(f"matrix={json.dumps({'include': include})}")
          PY

  bottle:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: ${{ fromJson(inputs.timeout) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.artifact }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.artifact }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax --tap="$GITHUB_REPOSITORY"

      - name: Build bottle
        run: brew test-bot --only-formulae --testing-formulae="${{ inputs.formula }}" --tap="$GITHUB_REPOSITORY"

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.artifact }}
          path: "*.bottle.*"

  upload:
    needs: bottle
    if: inputs.upload
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-rubygems-

      - name: Download bottles
        uses: actions/download-artifact@v4
        with:
          pattern: bottles_*

      - name: Flatten bottle artifacts
        run: find . -mindepth 2 -maxdepth 2 -type f -name "*.bottle.*" -exec mv {} . \;

      - name: Upload bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew pr-upload --debug

      - name: Push commits
        uses: Homebrew/actions/git-try-push@main
        with:
          branch: main
